[[language]]
name = "markdown"
comment-tokens = ["-", "+", "*", "1.", ">", "- [ ]"]
language-servers = [ "marksman", "harper-ls" ]
# language-servers = [ "iwe", "harper-ls" ]
# language-servers = [ "marksman" ]
auto-format = true # optional, enable format-on-save

[[language]]
name = "sql"
formatter = { command = "sleek" }

[[language]]
name = "json"
formatter = { command = "jq" }

[language-server.iwe]
command = "iwes"

[language-server.harper-ls]
command = "harper-ls"
args = ["--stdio"]

[language-server.harper-ls.config.harper-ls]
dialect = "American"
excludePatterns = ["/Users/denisnikulin/todo/*", "/Users/denisnikulin/Vault/TODO/*"]

[language-server.harper-ls.config.harper-ls.linters]
UseTitleCase = false

[language-server.harper-ls.config.harper-ls.markdown]
IgnoreLinkTitle = false



